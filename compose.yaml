services:
  assistant:
    build: .
    env_file: .env
    ports:
      - "127.0.0.1:${CASE_STUDY_PORT:-8080}:8000"
    volumes:
      - case-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/api/config', timeout=2).close()"]
      interval: 10s
      timeout: 3s
      start_period: 90s
      retries: 3

volumes:
  case-data:
